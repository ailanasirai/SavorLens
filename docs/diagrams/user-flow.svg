<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" role="img" aria-label="SavorLens user flow"><title>SavorLens user flow</title><desc>From a meal photo, through the MobileNetV2 classifier and a not sure branch, to a dietitian booking, user approval and a PayPal sandbox payment that is confirmed only when PayPal returns COMPLETED.</desc><defs><filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#1B3A2A" flood-opacity="0.16"/></filter><marker id="ah" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#4A5A52"/></marker><marker id="ah-2E9E5B" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#2E9E5B"/></marker><marker id="ah-003087" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#003087"/></marker><marker id="ah-F4511E" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#F4511E"/></marker><marker id="ah-8A9A92" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#8A9A92"/></marker><marker id="ah-D94B3D" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#D94B3D"/></marker><marker id="ah-E09F00" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#E09F00"/></marker></defs><rect width="1160" height="800" rx="24" fill="#FFFBF6"/><rect x="1.5" y="1.5" width="1157" height="797" rx="23" fill="none" stroke="#F0E3D6" stroke-width="3"/><rect x="40" y="60" width="150" height="30" rx="15.0" fill="#F4511E"/><text x="115.0" y="80.25" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">1  SCAN</text><rect x="40" y="117" width="190" height="76" rx="14" fill="#FFF0EA" stroke="#F4511E" stroke-width="2.5" filter="url(#sh)"/><text x="135.0" y="149.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">You photograph</text><text x="135.0" y="172.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">a meal</text><path d="M230,155 H268" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="270" y="117" width="215" height="76" rx="14" fill="#FFF0EA" stroke="#F4511E" stroke-width="2.5" filter="url(#sh)"/><text x="377.5" y="149.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">MobileNetV2</text><text x="377.5" y="172.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">classifier (12 dishes)</text><path d="M485,155 H538" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><polygon points="640,87.5 742.5,155 640,222.5 537.5,155" fill="#FFF6D6" stroke="#E09F00" stroke-width="2.5" filter="url(#sh)"/><text x="640" y="149.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">Confidence</text><text x="640" y="172.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">0.60 or higher?</text><path d="M742,155 H800" fill="none" stroke="#2E9E5B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><text x="771" y="143" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2E9E5B">Yes</text><rect x="802" y="117" width="300" height="76" rx="14" fill="#DFF3E6" stroke="#2E9E5B" stroke-width="2.5" filter="url(#sh)"/><text x="952.0" y="149.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">Dish, confidence and</text><text x="952.0" y="172.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">closest other guesses</text><path d="M640,223 V252" fill="none" stroke="#8A9A92" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-8A9A92)"/><text x="657" y="242" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#5A6B62">No</text><rect x="540" y="254" width="200" height="50" rx="14" fill="#EEF1EF" stroke="#8A9A92" stroke-width="2.5" filter="url(#sh)"/><text x="640.0" y="284.6" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Not sure (below 0.60)</text><path d="M952,193 V332" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M740,279 H952" fill="none" stroke="#8A9A92" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M952,332 H300 V398" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="352" width="250" height="30" rx="15.0" fill="#2E9E5B"/><text x="165.0" y="372.25" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2  BOOK AND APPROVE</text><rect x="40" y="400" width="280" height="80" rx="14" fill="#EAF7EF" stroke="#2E9E5B" stroke-width="2.5" filter="url(#sh)"/><text x="180.0" y="435.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Choose a dietitian</text><text x="180.0" y="456.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2F3E36">and a time slot (demo profiles)</text><path d="M320,440 H348" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="350" y="400" width="290" height="80" rx="14" fill="#EAF7EF" stroke="#2E9E5B" stroke-width="2.5" filter="url(#sh)"/><text x="495.0" y="435.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Booking agent prepares</text><text x="495.0" y="456.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2F3E36">summary: who, when, how much</text><path d="M640,440 H682" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><polygon points="785,377.5 887.5,440 785,502.5 682.5,440" fill="#FFF6D6" stroke="#E09F00" stroke-width="2.5" filter="url(#sh)"/><text x="785" y="434.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">User</text><text x="785" y="457.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">presses Approve?</text><path d="M887,440 H928" fill="none" stroke="#003087" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-003087)"/><text x="908" y="428" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2E9E5B">Yes</text><rect x="930" y="400" width="200" height="80" rx="14" fill="#E8EEF9" stroke="#003087" stroke-width="2.5" filter="url(#sh)"/><text x="1030.0" y="434.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">PayPal sandbox</text><text x="1030.0" y="457.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">order is created</text><path d="M785,502 V528" fill="none" stroke="#8A9A92" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-8A9A92)"/><text x="802" y="522" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#5A6B62">No</text><rect x="695" y="530" width="180" height="46" rx="14" fill="#EEF1EF" stroke="#8A9A92" stroke-width="2.5" filter="url(#sh)"/><text x="785.0" y="558.6" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Nothing is charged</text><path d="M1030,480 V598 H270 V658" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="612" width="150" height="30" rx="15.0" fill="#003087"/><text x="115.0" y="632.25" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3  PAY</text><rect x="40" y="660" width="250" height="80" rx="14" fill="#E8EEF9" stroke="#003087" stroke-width="2.5" filter="url(#sh)"/><text x="165.0" y="695.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Buyer approves in</text><text x="165.0" y="716.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2F3E36">PayPal checkout (sandbox)</text><path d="M290,700 H333" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="335" y="660" width="250" height="80" rx="14" fill="#E8EEF9" stroke="#003087" stroke-width="2.5" filter="url(#sh)"/><text x="460.0" y="695.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">Backend captures</text><text x="460.0" y="716.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2F3E36">the approved order</text><path d="M585,700 H640" fill="none" stroke="#4A5A52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><polygon points="745,637.5 847.5,700 745,762.5 642.5,700" fill="#FFF6D6" stroke="#E09F00" stroke-width="2.5" filter="url(#sh)"/><text x="745" y="694.9" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">PayPal status</text><text x="745" y="717.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#2F3E36">is COMPLETED?</text><path d="M847,700 H878 V652 H918" fill="none" stroke="#2E9E5B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><path d="M878,700 V748 H918" fill="none" stroke="#D94B3D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-D94B3D)"/><text x="893" y="690" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2E9E5B">Yes</text><text x="893" y="770" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#D94B3D">No</text><rect x="920" y="622" width="210" height="60" rx="14" fill="#DFF3E6" stroke="#2E9E5B" stroke-width="2.5" filter="url(#sh)"/><text x="1025.0" y="658.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">Booking confirmed</text><rect x="920" y="718" width="210" height="60" rx="14" fill="#FDE8E4" stroke="#D94B3D" stroke-width="2.5" filter="url(#sh)"/><text x="1025.0" y="754.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F3E36">Real error is shown</text></svg>