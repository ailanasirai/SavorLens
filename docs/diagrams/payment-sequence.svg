<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="SavorLens payment sequence"><title>SavorLens payment sequence</title><desc>Sequence of messages between the user, the Flutter app, the FastAPI backend and the PayPal sandbox, from pressing Approve and pay to a confirmed booking only when PayPal returns COMPLETED.</desc><defs><filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#1B3A2A" flood-opacity="0.16"/></filter><marker id="ah" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#4A5A52"/></marker><marker id="ah-2E9E5B" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#2E9E5B"/></marker><marker id="ah-003087" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#003087"/></marker><marker id="ah-F4511E" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#F4511E"/></marker><marker id="ah-8A9A92" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#8A9A92"/></marker><marker id="ah-D94B3D" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#D94B3D"/></marker><marker id="ah-E09F00" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#E09F00"/></marker></defs><rect width="1200" height="800" rx="24" fill="#FFFBF6"/><rect x="1.5" y="1.5" width="1197" height="797" rx="23" fill="none" stroke="#F0E3D6" stroke-width="3"/><line x1="130" y1="86" x2="130" y2="775" stroke="#CBBFB2" stroke-width="2.5" stroke-dasharray="6 7"/><rect x="35" y="30" width="190" height="52" rx="14" fill="#FFFFFF" stroke="#F4511E" stroke-width="3" filter="url(#sh)"/><text x="130" y="63" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2F3E36">User</text><line x1="430" y1="86" x2="430" y2="775" stroke="#CBBFB2" stroke-width="2.5" stroke-dasharray="6 7"/><rect x="335" y="30" width="190" height="52" rx="14" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="3" filter="url(#sh)"/><text x="430" y="63" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2F3E36">Flutter app</text><line x1="780" y1="86" x2="780" y2="775" stroke="#CBBFB2" stroke-width="2.5" stroke-dasharray="6 7"/><rect x="685" y="30" width="190" height="52" rx="14" fill="#FFFFFF" stroke="#003087" stroke-width="3" filter="url(#sh)"/><text x="780" y="63" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2F3E36">FastAPI backend</text><line x1="1070" y1="86" x2="1070" y2="775" stroke="#CBBFB2" stroke-width="2.5" stroke-dasharray="6 7"/><rect x="975" y="30" width="190" height="52" rx="14" fill="#FFFFFF" stroke="#E09F00" stroke-width="3" filter="url(#sh)"/><text x="1070" y="63" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2F3E36">PayPal sandbox</text><path d="M140,135 H420" fill="none" stroke="#F4511E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-F4511E)"/><text x="280.0" y="125" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">1. Approve and pay</text><path d="M440,187 H770" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><text x="605.0" y="177" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">2. POST /paypal/create-order</text><path d="M790,239 H1060" fill="none" stroke="#003087" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-003087)"/><text x="925.0" y="229" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">3. Create order</text><path d="M1060,291 H790" fill="none" stroke="#E09F00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ah-E09F00)"/><text x="925.0" y="281" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A6B62">4. Order id and approve link</text><path d="M770,343 H440" fill="none" stroke="#003087" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ah-003087)"/><text x="605.0" y="333" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A6B62">5. Order id and approve link</text><path d="M420,395 H140" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><text x="280.0" y="385" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">6. Open PayPal checkout</text><path d="M140,447 H1060" fill="none" stroke="#F4511E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-F4511E)"/><text x="600.0" y="437" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">7. Approve with a sandbox Personal (buyer) account</text><path d="M140,499 H420" fill="none" stroke="#F4511E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-F4511E)"/><text x="280.0" y="489" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">8. I approved in PayPal</text><path d="M440,551 H770" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><text x="605.0" y="541" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">9. POST /paypal/capture-order/{order_id}</text><path d="M790,603 H1060" fill="none" stroke="#003087" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-003087)"/><text x="925.0" y="593" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">10. Capture order</text><path d="M1060,655 H790" fill="none" stroke="#E09F00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ah-E09F00)"/><text x="925.0" y="645" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A6B62">11. Status</text><path d="M770,707 H440" fill="none" stroke="#003087" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ah-003087)"/><text x="605.0" y="697" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A6B62">12. Status</text><path d="M420,759 H140" fill="none" stroke="#2E9E5B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2E9E5B)"/><text x="280.0" y="749" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36">13. Confirmed only if COMPLETED</text></svg>