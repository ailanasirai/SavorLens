<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="SavorLens: Snap your plate. Understand your meal." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1E4"/>
      <stop offset="1" stop-color="#E3F5E8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4511E"/>
      <stop offset="1" stop-color="#2E9E5B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1B3A2A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <!-- decorative food dots -->
  <circle cx="1130" cy="60" r="26" fill="#FF7043" opacity="0.35"/>
  <circle cx="1200" cy="130" r="16" fill="#66BB6A" opacity="0.45"/>
  <circle cx="1090" cy="200" r="34" fill="#FFCA28" opacity="0.35"/>
  <circle cx="1210" cy="250" r="22" fill="#EF5350" opacity="0.30"/>
  <circle cx="980" cy="270" r="14" fill="#66BB6A" opacity="0.45"/>
  <circle cx="960" cy="50" r="12" fill="#FFCA28" opacity="0.5"/>
  <circle cx="1000" cy="150" r="20" fill="#FF7043" opacity="0.2"/>

  <!-- lens logo -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="160" r="82" fill="#FFFFFF"/>
  </g>
  <circle cx="150" cy="160" r="60" fill="none" stroke="#F4511E" stroke-width="10"/>
  <circle cx="150" cy="160" r="34" fill="#2E9E5B"/>
  <circle cx="138" cy="148" r="9" fill="#FFFFFF" opacity="0.75"/>

  <!-- text -->
  <text x="270" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#title)">SavorLens</text>
  <text x="272" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="600" fill="#2F3E36">Snap your plate. Understand your meal.</text>
  <text x="272" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5A6B62">AI meal recognition with a human-approved PayPal dietitian booking</text>

  <!-- pills -->
  <g filter="url(#shadow)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2F3E36" text-anchor="middle">
    <rect x="272" y="258" width="150" height="38" rx="19" fill="#FFFFFF"/>
    <text x="347" y="283">MobileNetV2</text>
    <rect x="436" y="258" width="118" height="38" rx="19" fill="#FFFFFF"/>
    <text x="495" y="283">FastAPI</text>
    <rect x="568" y="258" width="118" height="38" rx="19" fill="#FFFFFF"/>
    <text x="627" y="283">Flutter</text>
    <rect x="700" y="258" width="190" height="38" rx="19" fill="#FFFFFF"/>
    <text x="795" y="283">PayPal Sandbox</text>
  </g>
</svg>
