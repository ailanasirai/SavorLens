<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="Three ideas behind SavorLens: recognise, say not sure, approve then pay" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B3A2A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="25" y="20" width="390" height="190" rx="20" fill="#FFFFFF"/>
  </g>
  <circle cx="78" cy="72" r="28" fill="#FFE9DE"/>
  <circle cx="78" cy="72" r="15" fill="none" stroke="#F4511E" stroke-width="5"/>
  <circle cx="78" cy="72" r="6" fill="#2E9E5B"/>
  <text x="122" y="81" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2F3E36">Recognise</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55655C">
    <text x="55" y="130">MobileNetV2 identifies 12 dishes</text>
    <text x="55" y="156">and shows its confidence and its</text>
    <text x="55" y="182">closest other guesses.</text>
  </g>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="445" y="20" width="390" height="190" rx="20" fill="#FFFFFF"/>
  </g>
  <circle cx="498" cy="72" r="28" fill="#FFF3CD"/>
  <text x="498" y="83" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#E09F00">?</text>
  <text x="542" y="81" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2F3E36">Say "not sure"</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55655C">
    <text x="475" y="130">Below 0.60 confidence the app says</text>
    <text x="475" y="156">it is not sure, instead of guessing.</text>
    <text x="475" y="182">Honest by design.</text>
  </g>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="865" y="20" width="390" height="190" rx="20" fill="#FFFFFF"/>
  </g>
  <circle cx="918" cy="72" r="28" fill="#DFF3E6"/>
  <path d="M905 73 L915 83 L933 62" fill="none" stroke="#2E9E5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="962" y="81" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2F3E36">Approve, then pay</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55655C">
    <text x="895" y="130">A PayPal sandbox order starts only</text>
    <text x="895" y="156">after you approve. The booking is</text>
    <text x="895" y="182">confirmed only on COMPLETED.</text>
  </g>
</svg>
